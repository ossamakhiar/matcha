version: '3.8'   

services:
  postgres:
    image: postgres:16
    container_name: postgresql
    restart: on-failure
    env_file: ./backend/database/.env
    networks:
      - backend
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: pgadmin
  #   env_file:
  #     - ./backend/database/.env
  #   ports:
  #     - "${PGADMIN_MAPPED_PORT}:${PGADMIN_HOST_PORT}"
  #   depends_on:
  #     - postgres
  #   networks:
  #     - backend

  db_migrate:
    build:
      context: ./backend/database
      target: db_migrate
    depends_on:
      postgres:
        condition: service_healthy
    # do we actually need the volume? maybe if we make use of node-pg-migrate
    # volumes:
    #   - ./backend/database/migrations:/migrations
    env_file:
      - ./backend/database/.env
    networks:
      - backend

  backend:
    build:
      context: ./backend/backend
      target: dev
    container_name: backend
    # restart: on-failure
    env_file:
      - ./backend/backend/app/.env
    volumes:
      - ./backend/backend/app:/app
      # Exculde node_modules
      - /app/node_modules
    networks:
      - backend
    depends_on:
      - postgres
    ports:
      - ${API_PORT}:${API_PORT}

  frontend:
    build: ./frontend
    image: frontend
    container_name: frontend
    restart: on-failure
    env_file:
      - ./frontend/app/.env
    depends_on:
      - backend
    networks:
      - backend
    ports:
      - ${FRONTEND_PORT}:${FRONTEND_PORT}

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
